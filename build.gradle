plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

ext {
    // Sesuai Buku Spring AI in Action Bab 1.1.1 (Listing 1.1)
    set('springAiVersion', "1.0.0-M3")
}

dependencies {
    // Web REST API
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Spring AI OpenAI Starter (Lab 1.1 - 1.6 & Chapter 2)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    
    // Spring Retry & AOP untuk Self-Evaluation saat Runtime (Lab 2.3 Listing 2.2)
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // Model Lokal Ollama Starter (Lab 1.7)
    // implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

    // Testing Dependencies (Lab 1.4 WireMock & Lab 2.1-2.2 Evaluator)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.wiremock.integrations:wiremock-spring-boot:3.9.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
